services:
  backend:
    ports:
      - "5001:5001"

  frontend:
    ports:
      - "3000:80"

  seaweedfs:
    ports:
      - "8333:8333"
      - "8888:8888"

  nginx:
    ports:
      - "8089:80"
      - "8443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl



